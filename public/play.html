<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2A2B">
<meta name="format-detection" content="telephone=no">
<title>Theranos Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Look: a blood-testing lab. The drop is the one loud element; everything else stays clinical and calm. */
:root{--paper:#EEF6F3;--card:#fff;--ink:#0E2A2B;--gray:#4F6B67;--line:#C9DDD7;--soft:#E1EEEA;
  --teal:#2FA890;--teal-d:#1B7A68;--teal-l:#D6EFE8;--blood:#B5122E;--blood-l:#FBE1E6;--red:#B5122E;--amber:#C9820A;--slate:#2D4B8E;--rose:#8E2F6B;
  --ui:'Archivo','Arial Narrow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--quote:'Instrument Serif',Georgia,'Times New Roman',serif;
  --serif:var(--quote);--sans:var(--ui)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--paper);color:var(--ink);font-family:var(--ui);min-height:100%;overscroll-behavior-y:none}
body{padding-bottom:40px;padding-bottom:calc(40px + env(safe-area-inset-bottom));font-size:17px;line-height:1.4}
button,input{font-family:inherit;-webkit-appearance:none;appearance:none;border-radius:0;touch-action:manipulation}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.top{display:none}
header{position:-webkit-sticky;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
.logo{font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:-.5px;color:#fff;white-space:nowrap}
.logo i,.drop{display:inline-block;width:.62em;height:.62em;background:var(--blood);border-radius:0 55% 55% 55%;-webkit-transform:rotate(45deg);transform:rotate(45deg);margin:0 .12em 0 .1em;vertical-align:.02em}
.me{text-align:right;font-size:13px;line-height:1.25;color:#B9D3CD;min-width:0;margin-left:12px}
.me b{display:block;font-size:16px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.wrap{padding:22px 16px 8px;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));max-width:560px;margin:0 auto}
h1{font-weight:800;font-stretch:75%;font-size:40px;line-height:1;letter-spacing:-.5px;margin-bottom:10px}
h2{font-weight:800;font-stretch:80%;font-size:29px;line-height:1.08;letter-spacing:-.3px;margin-bottom:8px}
.kicker{display:inline-block;font-size:13px;font-weight:700;color:var(--teal-d);background:var(--teal-l);padding:4px 10px;border-radius:99px;margin-bottom:10px}
p,.muted{color:var(--gray);font-size:16px;line-height:1.45}
input{display:block;width:100%;font-size:20px;font-weight:600;padding:15px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);margin:14px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:8px;margin:10px 0 18px}
.pick{font-size:16px;font-weight:700;min-height:52px;padding:10px 4px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.pick.on{border-color:var(--ink);background:var(--ink);color:#fff}
/* Buttons you can feel: a hard ink edge underneath that the button sinks into when pressed. */
.btn,.vbtn{display:block;width:100%;font-size:21px;font-weight:800;font-stretch:88%;min-height:60px;padding:16px;margin-top:10px;border:2px solid var(--ink);border-radius:16px;
  background:var(--teal);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active,.vbtn:active{-webkit-transform:translateY(5px);transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{background:var(--soft);color:#8FA5A0;border-color:#8FA5A0;box-shadow:0 5px 0 #8FA5A0}
.btn.ghost{background:#fff}
.vbtn{background:#fff;margin:0 0 15px;min-height:66px;font-size:23px}
.vbtn.on{background:var(--ink);color:#fff}
.vbtn.believe{background:var(--teal-l)}.vbtn.challenge{background:var(--blood-l)}
.vbtn.believe.on{background:var(--teal-d);color:#fff}.vbtn.challenge.on{background:var(--blood);color:#fff}
.ok{font-weight:700;color:var(--teal-d);margin-top:4px;font-size:15px}
.err{color:var(--blood);font-weight:700;font-size:15px;margin-top:10px;min-height:20px}
.box{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.box b{display:block;font-size:18px}
.list{list-style:none;margin-top:10px;background:#fff;border-radius:16px;border:2px solid var(--line);padding:4px 14px}
.list li{font-size:16px;line-height:1.35;padding:11px 0 11px 22px;border-top:1px solid var(--soft);position:relative}
.list li:first-child{border-top:0}
.list li:before{content:'';position:absolute;left:3px;top:17px;width:9px;height:9px;background:var(--teal);border-radius:0 55% 55% 55%;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
.list.red li:before{background:var(--blood)}
.motion{font-family:var(--quote);font-size:27px;line-height:1.18;margin:10px 0 18px}
.concept{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--slate);padding:4px 10px;border-radius:99px;margin:0 0 4px 6px}
.big{font-weight:800;font-stretch:75%;font-size:68px;line-height:1;margin:8px 0}
.center{text-align:center;padding-top:7vh}
/* Waiting = a slow drip. */
.pulse{width:64px;height:64px;margin:6px auto 30px;background:var(--blood);border-radius:0 55% 55% 55%;-webkit-transform:rotate(45deg);transform:rotate(45deg);-webkit-animation:drip 1.8s ease-in-out infinite;animation:drip 1.8s ease-in-out infinite}
@-webkit-keyframes drip{0%,100%{-webkit-transform:translateY(-8px) rotate(45deg) scale(.82);opacity:.75}55%{-webkit-transform:translateY(8px) rotate(45deg) scale(1);opacity:1}}
@keyframes drip{0%,100%{transform:translateY(-8px) rotate(45deg) scale(.82);opacity:.75}55%{transform:translateY(8px) rotate(45deg) scale(1);opacity:1}}
/* The CEO's cards: three specimens, one choice. */
.pcard{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px 14px 12px;margin-top:14px;color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.pcard.on{background:var(--ink);color:#fff;-webkit-transform:translateY(5px) rotate(-1deg);transform:translateY(5px) rotate(-1deg);box-shadow:0 0 0 var(--ink)}
.lab{display:inline-block;font-size:13px;font-weight:800;color:#fff;padding:4px 11px;border-radius:99px}
.lab.honest{background:var(--teal-d)}.lab.exaggeration{background:var(--amber)}.lab.lie{background:var(--blood)}
.pcard .tx{font-family:var(--quote);font-size:24px;line-height:1.16;margin:10px 0 8px}
.pcard .pts{font-size:14px;font-weight:600;color:var(--gray)}
.pcard.on .pts{color:#B9D3CD}
/* What the CEO said, as a speech bubble. */
.claim{position:relative;font-family:var(--quote);font-size:27px;line-height:1.16;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:16px 16px 18px;margin:14px 0 24px}
.claim:after{content:'';position:absolute;left:28px;bottom:-11px;width:18px;height:18px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);-webkit-transform:rotate(45deg);transform:rotate(45deg)}
.verify{display:block;width:100%;font-size:16px;font-weight:700;min-height:56px;padding:12px;margin-top:2px;border:2px dashed var(--ink);border-radius:16px;background:transparent;color:var(--ink)}
.verify .drop{width:.8em;height:.8em;margin:0 .22em;vertical-align:-.02em}
.verify .drop.used{background:var(--line)}
.verify:disabled{opacity:.45}
.truthtag{display:block;border-radius:14px;padding:13px;margin:0 0 16px;font-size:17px;font-weight:800;color:#fff;text-align:center}
.ceobadge{background:var(--blood);color:#fff;border-radius:22px;padding:26px 18px;margin-top:10px;border:2px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.ceobadge .big{font-size:44px}
.ceobadge p{color:#FBD5DC}
/* Results read like a lab report. */
.res{border-radius:22px;border:2px solid var(--ink);padding:24px 16px;text-align:center;color:#fff;margin-top:6px;box-shadow:0 6px 0 var(--ink)}
.res.good{background:var(--teal-d)}.res.bad{background:var(--blood)}.res.none{background:var(--gray)}
.res .big{font-size:50px}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-top:2px solid var(--line);font-size:16px}
.vrow>*+*{margin-left:12px}
.vrow b{white-space:nowrap;font-size:20px}
.tag{font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--teal-l);color:var(--teal-d);white-space:nowrap}
.tag.no{background:var(--soft);color:var(--gray)}
.breakdown{display:grid;grid-template-columns:1fr auto;grid-gap:8px 16px;font-size:17px;text-align:left}
.breakdown b{text-align:right;display:block}
/* Quiz */
.qopts{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-top:14px}
.qo{min-height:124px;border:2px solid var(--ink);border-radius:18px;color:#fff;font-size:17px;font-weight:700;line-height:1.2;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 0 var(--ink)}
.qo:active{-webkit-transform:translateY(5px);transform:translateY(5px);box-shadow:none}
.qo .sh{font-size:28px;margin-bottom:6px}
.q0{background:var(--teal-d)}.q1{background:var(--slate)}.q2{background:var(--amber)}.q3{background:var(--rose)}
.qtrack{height:10px;background:var(--soft);border-radius:99px;margin-top:12px;overflow:hidden}
.qfill{height:100%;background:var(--blood);border-radius:99px}
/* Activity 2 on phones (optional mode) */
.co{background:#fff;border:2px solid var(--line);border-radius:16px;margin-top:12px;padding:12px 14px}
.co .h{display:flex;align-items:center}
.co .nm{flex:1;min-width:0}
.co .nm b{font-size:22px;font-weight:800;font-stretch:80%;display:block;line-height:1.05}
.co .nm small{color:var(--gray);font-size:13px}
.step{display:flex;align-items:center}
.step button{width:48px;height:48px;font-size:24px;font-weight:800;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.step button:disabled{opacity:.25}
.step span{min-width:56px;text-align:center;font-weight:800;font-size:20px}
.more{font-size:14px;font-weight:700;color:var(--teal-d);background:none;border:0;padding:10px 0 2px;text-decoration:underline}
.budget{position:-webkit-sticky;position:sticky;top:52px;background:var(--paper);padding:10px 0;z-index:2}
.btrack{height:12px;background:var(--soft);border-radius:99px;margin-top:6px;overflow:hidden}
.bfill{height:100%;background:var(--teal);transition:width .2s}
.lens{padding:7px 0;border-top:1px solid var(--soft);font-size:14px;line-height:1.35}
.lens small{display:block;font-size:12px;font-weight:800;color:var(--slate)}
.story{font-size:14px;color:var(--gray);margin:6px 0 4px;line-height:1.35}
.mult{font-weight:800;font-stretch:75%;font-size:84px;line-height:1}
.zero{color:var(--blood)}.win{color:var(--teal-d)}
.fade{-webkit-animation:none;animation:none}
.conn{position:fixed;left:0;right:0;bottom:0;background:var(--amber);color:#fff;text-align:center;font-weight:700;font-size:15px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:9}
@media (max-width:350px){h1{font-size:33px}h2{font-size:25px}.claim,.motion{font-size:23px}.pcard .tx{font-size:21px}.grid2{grid-template-columns:1fr 1fr}.qo{min-height:108px;font-size:15px}.big{font-size:56px}}
@media (orientation:landscape) and (max-height:480px){.center{padding-top:2vh}.pulse{width:44px;height:44px;margin-bottom:18px}.wrap{max-width:720px}}
@media (prefers-reduced-motion:reduce){.pulse{-webkit-animation:none;animation:none}.btn,.vbtn,.pcard,.qo{transition:none}}
</style>
</head>
<body>
<div class="top"></div>
<header><div class="logo">theran<i></i>s</div><div class="me" id="me"></div></header>
<div class="wrap" id="app"></div>
<div class="conn" id="conn" hidden>Reconnecting…</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const socket = io();
let C = null, S = null, pid = store.get('pid'), joined = false, offset = 0, lastKey = '', tick = null;
let draft = null, investErr = '', openCo = {};
let chosenGroup = null;
const shapes = ['▲', '◆', '●', '■'];

fetch('/content.json').then((r) => r.json()).then((c) => { C = c; draw(); });

socket.on('connect', () => {
  $('#conn').hidden = true;
  if (pid) socket.emit('join', { pid }, (res) => { if (res && res.ok) { joined = true; } else { pid = null; store.del('pid'); joined = false; } draw(); });
  else draw();
});
socket.on('disconnect', () => { $('#conn').hidden = false; });
socket.on('reset', () => { pid = null; joined = false; store.del('pid'); draft = null; S = null; lastKey = ''; draw(); });
socket.on('state', (s) => { offset = s.now - Date.now(); S = s; draw(); });

function joinForm() {
  const groups = (C && C.groups) || [];
  return `<div class="fade"><div class="kicker">Governance at Theranos</div><h1>Join the boardroom</h1>
    <p>Pick a name the class will see on the leaderboard.</p>
    <input id="name" maxlength="18" placeholder="Your name" autocomplete="off" autocapitalize="words">
    <p style="margin-top:10px">Your group</p>
    <div class="grid2">${groups.map((g) => `<button class="pick ${chosenGroup === g ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>
    <button class="btn" id="go">Join</button><div class="err" id="jerr"></div></div>`;
}
function bindJoin() {
  document.querySelectorAll('.pick').forEach((b) => b.onclick = () => {
    chosenGroup = b.dataset.g;
    document.querySelectorAll('.pick').forEach((x) => x.classList.toggle('on', x === b));
  });
  $('#go').onclick = () => {
    const name = $('#name').value.trim();
    if (!name) { $('#jerr').textContent = 'Enter a name first.'; return; }
    $('#go').disabled = true;
    socket.emit('join', { name, group: chosenGroup }, (res) => {
      if (res && res.ok) { pid = res.pid; store.set('pid', pid); joined = true; draw(); }
      else { $('#go').disabled = false; $('#jerr').textContent = 'Could not join. Try again.'; }
    });
  };
}

function header() {
  if (!S || !S.me) { $('#me').innerHTML = ''; return; }
  const m = S.me;
  $('#me').innerHTML = `<b>${esc(m.name)}</b>${m.group ? esc(m.group) + ', ' : ''}${m.score.total.toLocaleString()} pts`;
}

// Redraw only when what the phone shows actually changes, so inputs don't reset mid-tap.
function viewKey() {
  if (!joined || !S || !S.me) return 'join';
  const ph = S.phase, m = S.me;
  switch (ph.type) {
    case 'vote': return ph.id + ':' + (m.votes[S.motion.id] || '');
    case 'invest': return 'invest:' + JSON.stringify(m.alloc);
    case 'quiz': return ph.id + ':' + (S.quiz.revealed ? 'r' : 'o') + ':' + (m.answer ? m.answer.choice : '');
    case 'lobby': return 'lobby';
    case 'ceoAssign': case 'pitchRound': case 'superVote': case 'pitchStandings':
      return ph.id + ':' + ((S.round && S.round.stage) || (S.superVote && S.superVote.stage) || '') + ':' + JSON.stringify(m.pitch);
    default: return ph.id + ':' + m.score.total + ':' + m.rank;
  }
}

function draw() {
  if (!C) return;
  header();
  const key = viewKey();
  if (key === lastKey && key !== 'join') return;
  if (key === 'join' && lastKey === 'join' && $('#name')) return;
  lastKey = key;
  clearInterval(tick);
  if (key === 'join') { $('#app').innerHTML = joinForm(); bindJoin(); return; }
  const v = V[S.phase.type];
  $('#app').innerHTML = `<div class="fade">${v ? v() : wait('Watch the big screen')}</div>`;
  bind[S.phase.type] && bind[S.phase.type]();
}

const wait = (title, sub = '') => `<div class="center"><div class="pulse"></div><h2>${esc(title)}</h2><p>${sub}</p></div>`;

const V = {
  lobby: () => wait(`You're in, ${S.me.name}`, 'Watch the big screen. The game starts soon.'),
  packetA: () => `<div class="kicker">Activity #1 · You are the board</div><h2>${esc(C.packetA.title)}</h2><p>${esc(C.packetA.byline)}</p>
    <ul class="list">${C.packetA.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul><p style="margin-top:14px">Voting opens next.</p>`,
  vote: () => {
    const m = S.motion, mine = S.me.votes[m.id];
    const head = m.warmup ? `<div class="kicker">Warm-up from lecture · no points</div><h2>Would you invest?</h2>` : `<div class="kicker">Activity #1 · ${esc(m.title)}</div><div class="concept">Lecture · ${esc(m.concept)}</div>`;
    return `${head}<div class="motion">${esc(m.text)}</div>
      ${m.options.map((o) => `<button class="vbtn ${mine === o ? 'on' : ''}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}
      ${mine ? `<div class="ok">✓ Vote saved. You can change it until we move on.</div>` : ''}`;
  },
  pitch: () => wait('Listen to your CEO', 'She’s asking the board for trust.'),
  packetB: () => `<div class="kicker">Activity #1 · New information</div><h2>${esc(C.packetB.title)}</h2>
    <ul class="list red">${C.packetB.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul><p style="margin-top:14px">Your final vote is next.</p>`,
  boardReveal: () => {
    const rows = S.board.map((m) => {
      const v = S.me.votes[m.id];
      const tag = !m.sound.length ? `<span class="tag no">no points</span>` : (m.sound.includes(v) ? `<span class="tag">+250</span>` : `<span class="tag no">+0</span>`);
      return `<div class="vrow"><span>${esc(m.title)}: <b>${esc(v || 'no vote')}</b><br><small style="color:#4b2e83">${esc(m.concept)}</small></span>${tag}</div>`;
    }).join('');
    return `<div class="kicker">Activity #1 · Your votes</div><h2>How sound was your board?</h2>${rows}
      <div class="vrow"><span>Board points</span><b>${S.me.score.votes}</b></div><p style="margin-top:12px">Check the big screen for what the real board did.</p>`;
  },
  callback: () => `<div class="kicker">Back to lecture</div><h2>Three mechanisms, all switched off</h2>
    <div class="box"><b>Board of directors</b><p>Famous outsiders, no lab expertise, couldn’t verify the technology.</p></div>
    <div class="box"><b>Shareholder activism</b><p>The CEO held 99.7% of the votes; proxy votes meant nothing.</p></div>
    <div class="box"><b>Rewards and incentives</b><p>Dismissal was never a realistic threat.</p></div>`,

  pitchRules: () => wait('Activity #1: The Pitch', 'One person in your group becomes CEO. The CEO pitches claims; the board decides what to believe. Watch the screen.'),
  ceoAssign: () => {
    const p = S.me.pitch;
    if (p.role === 'solo') return wait('Your group needs one more person', 'Find a teammate: the game needs a CEO and at least one board member.');
    if (p.role === 'ceo') return `<div class="center" style="padding-top:4vh"><div class="kicker">The Pitch</div><div class="ceobadge fade"><div class="big">You are the CEO</div><p style="color:#ddd;margin-top:8px">Your cards appear here each round. Don’t show anyone your phone.</p></div>
      <p style="margin-top:16px">Pick a claim, then read it aloud to your board like you mean it.</p></div>`;
    return `<div class="center" style="padding-top:4vh"><div class="kicker">The Pitch</div><h2>You’re on the board</h2>
      <div class="big" style="font-size:34px">${esc(p.ceoName)}</div><p>is your CEO. Decide what to believe.</p>
      <div class="box">Your board can run <b style="display:inline">${p.tokens} lab test${p.tokens === 1 ? '' : 's'}</b> this game. A test shows whether a claim is true.</div></div>`;
  },
  pitchRound: () => {
    const p = S.me.pitch, r = S.round;
    const head = `<div class="kicker">Round ${r.number} of ${r.total}: ${esc(r.topic)}</div>`;
    if (p.role === 'solo') return head + wait('Sit this round out', 'Your group needs at least two people.');
    if (r.stage === 'reveal' && p.result) {
      const res = p.result, mine = res.mine;
      const caught = res.decision === 'challenge' && res.kind !== 'honest';
      const msg = p.role === 'ceo'
        ? (res.decision === 'believe' ? 'Your board believed you.' : caught ? (res.immune ? 'Caught, but you’re immune.' : 'Your board caught you.') : 'Your board doubted the truth.')
        : (res.decision === 'believe' ? (res.kind === 'honest' ? 'Your board trusted the truth.' : 'Your board believed it: you got played.') : (caught ? 'Your board caught it.' : 'Your board challenged the truth.'));
      return `${head}<div class="res ${mine > 0 ? 'good' : mine < 0 ? 'bad' : 'none'}"><div style="font-size:16px;opacity:.85">${p.role === 'ceo' ? 'You pitched' : 'Your CEO told you'}</div>
        <div class="big" style="font-size:36px">${esc(res.label)}</div><div style="font-size:18px;margin-top:6px">${esc(msg)} ${mine > 0 ? '+' : ''}${mine} ${p.role === 'ceo' ? 'for you' : 'for the board'}</div></div>
        <div class="claim" style="font-size:18px">${esc(res.text)}</div>
        <div class="vrow"><span>${p.role === 'ceo' ? 'Your CEO points' : 'Board points'}</span><b>${p.teamPoints}</b></div>`;
    }
    if (p.role === 'ceo') {
      if (r.stage === 'pick') {
        return `${head}<h2>What will you tell your board?</h2><p>Tap a card. You can change it until the host moves on.</p>
          ${p.cards.map((c, i) => `<button class="pcard ${p.picked === i ? 'on' : ''}" data-i="${i}"><span class="lab ${c.kind}">${esc(c.label)}</span>
            <div class="tx">${esc(c.text)}</div><div class="pts">If believed: ${sign(c.ifBelieved)} · If challenged: ${sign(c.ifChallenged)}${p.immune && c.ifChallenged < 0 ? ' (immune: 0)' : ''}</div></button>`).join('')}
          ${p.picked !== null ? '<div class="ok" style="margin-top:12px">✓ Now read it aloud to your board.</div>' : ''}`;
      }
      const c = p.cards[p.picked];
      return `${head}<h2>Your board is deciding…</h2><div class="claim">${esc(c.text)}</div><p>Hold your poker face.${p.immune ? ' You’re immune: getting caught costs you nothing.' : ''}</p>`;
    }
    if (r.stage === 'pick') return head + wait(`${p.ceoName} is choosing what to tell you…`, 'Listen closely when they pitch.');
    return `${head}<div class="muted">${esc(p.ceoName)} says:</div><div class="claim">${esc(p.claim)}</div>
      ${p.verified ? `<div class="truthtag lab ${p.truthLabel.toLowerCase()}">Test result: ${p.truthLabel === 'Honest' ? 'honest' : p.truthLabel === 'Lie' ? 'a lie' : 'an exaggeration'}</div>` : ''}
      <button class="vbtn believe ${p.myVote === 'believe' ? 'on' : ''}" data-v="believe">Believe</button>
      <button class="vbtn challenge ${p.myVote === 'challenge' ? 'on' : ''}" data-v="challenge">Challenge</button>
      ${p.verified ? '' : `<button class="verify" id="verify" ${p.tokens <= 0 ? 'disabled' : ''}>${drops(p.tokens)} ${p.tokens > 0 ? 'Run the test on this claim' : 'No tests left'}</button><p style="font-size:14px;text-align:center;margin-top:8px">A test shows your whole board the truth. You get ${C.verifyTokens} for the game.</p>`}
      ${p.myVote ? '<div class="ok">✓ Vote saved. You can change it until the host moves on.</div>' : ''}`;
  },
  superVote: () => {
    const p = S.me.pitch, sv = S.superVote;
    if (p.role === 'solo') return wait('Sit this one out', 'Your group needs at least two people.');
    if (sv.stage === 'reveal' && p.result) {
      const ok = p.result.decision === 'approve';
      return `<div class="kicker">Surprise proposal</div><div class="res ${ok ? (p.role === 'ceo' ? 'good' : 'bad') : (p.role === 'ceo' ? 'none' : 'good')}"><div class="big" style="font-size:36px">${ok ? 'Approved' : 'Rejected'}</div>
        <div style="font-size:18px;margin-top:6px">${ok ? 'The CEO can no longer lose points for getting caught.' : 'The board kept its power.'}</div></div>
        <p style="margin-top:14px">${esc(sv.real)}</p>`;
    }
    if (p.role === 'ceo') return `<div class="kicker">Surprise proposal</div><h2>Lobby your board</h2><div class="claim">${esc(sv.text)}</div>
      <p>If they approve: you get +${C.superMotion.approve.ceo} and can no longer lose points for getting caught. Make your case.</p>`;
    return `<div class="kicker">${esc(p.ceoName)} has a surprise proposal</div><div class="claim">${esc(sv.text)}</div>
      <p style="margin-bottom:12px">If approved, your CEO gets +${C.superMotion.approve.ceo} and can’t lose points for getting caught again. Ties go to the CEO.</p>
      <button class="vbtn believe ${p.myVote === 'approve' ? 'on' : ''}" data-s="approve">Approve</button>
      <button class="vbtn challenge ${p.myVote === 'reject' ? 'on' : ''}" data-s="reject">Reject</button>
      ${p.myVote ? '<div class="ok">✓ Vote saved.</div>' : ''}`;
  },
  pitchStandings: () => {
    const p = S.me.pitch;
    return `<div class="center"><div class="kicker">Activity #1 · Results</div><h2>${p.role === 'ceo' ? 'Your CEO score' : 'Your board’s score'}</h2><div class="big">${p.teamPoints > 0 ? '+' : ''}${p.teamPoints}</div><p>Check the big screen for the rankings.</p></div>`;
  },
  pitchTruth: () => wait('What Theranos really said', 'Every lie card was a real claim to investors. Watch the screen.'),
  paperBreak: () => wait('Phones down for Activity #2', 'It’s on paper with your group. Keep this page open; the final quiz comes back here.'),
  profiles: () => `<div class="kicker">Activity #2 · You have $10M</div><h2>Study the four companies</h2><p>Investing opens next. Names are disguised; judge them with the lecture’s Deep Dive lenses.</p>
    ${C.companyOrder.map((k) => coCard(k, false)).join('')}`,
  invest: () => {
    if (S.me.alloc && !draft) {
      return `<div class="kicker">Activity #2</div><h2>Portfolio locked in</h2>
        ${C.companyOrder.map((k) => `<div class="vrow"><span>${esc(C.companies[k].alias)}</span><b>$${S.me.alloc[k]}M</b></div>`).join('')}
        <button class="btn ghost" id="edit" style="margin-top:16px">Change it</button><p style="margin-top:12px">You can edit until the reveal starts.</p>`;
    }
    draft = draft || { A: 0, B: 0, C: 0, D: 0 };
    return `<div class="budget"><div class="kicker">Activity #2 · Invest</div><div style="display:flex;justify-content:space-between;font-weight:800"><span>Invested</span><span id="bsum"></span></div>
      <div class="btrack"><div class="bfill" id="bfill"></div></div></div>
      <p style="margin-top:10px">$1M steps · max $5M per company · must total $10M</p>
      ${C.companyOrder.map((k) => coCard(k, true)).join('')}
      <button class="btn" id="submit">Lock in portfolio</button><div class="err" id="ierr">${esc(investErr)}</div>`;
  },
  companyReveal: () => {
    const c = S.company, mine = S.me.alloc ? S.me.alloc[c.key] : 0;
    return `<div class="center" style="padding-top:4vh"><div class="kicker">Company ${esc(c.key)} · ${esc(c.alias)} is…</div><h1>${esc(c.identity)}</h1>
      <div class="mult ${c.multiplier ? 'win' : 'zero'}">×${c.multiplier}</div>
      <div class="box">You invested <b>$${mine}M</b> → <b>$${mine * c.multiplier}M</b></div></div>`;
  },
  portfolio: () => `<div class="center"><div class="kicker">Activity #2 · Results</div><h2>Your portfolio is worth</h2>
    <div class="big">$${S.me.portfolioValue}M</div><p>${S.me.portfolioRank ? `#${S.me.portfolioRank} of the class` : 'You didn’t lock in a portfolio.'}</p></div>`,
  quizIntro: () => wait('Lightning quiz next', 'Get your thumb ready. Faster right answers score more.'),
  quiz: () => {
    const q = S.quiz, a = S.me.answer;
    if (q.revealed) {
      const right = a && a.choice === q.correct;
      const cls = !a ? 'none' : right ? 'good' : 'bad';
      return `<div class="kicker">Question ${q.number} of ${q.total}</div>
        <div class="res ${cls}"><div class="big">${!a ? 'No answer' : right ? 'Correct!' : 'Not quite'}</div>
        <div style="font-size:18px;margin-top:8px">${right ? '+' + a.points + ' points' : 'Answer: ' + esc(q.options[q.correct])}</div></div>
        <div class="vrow" style="margin-top:14px"><span>Your rank</span><b>#${S.me.rank} of ${S.me.of}</b></div>`;
    }
    if (a) return wait('Locked in', 'Watch the big screen for the answer.');
    return `<div class="kicker">Question ${q.number} of ${q.total}</div><div class="motion" style="font-size:21px">${esc(q.question)}</div>
      <div class="qtrack"><div class="qfill" id="qfill"></div></div>
      <div class="qopts">${q.options.map((o, i) => `<button class="qo q${i}" data-i="${i}"><span class="sh">${shapes[i]}</span>${esc(o)}</button>`).join('')}</div>`;
  },
  final: () => {
    const s = S.me.score;
    return `<div class="center" style="padding-top:4vh"><div class="kicker">Final results</div><h2>You finished</h2>
      <div class="big">#${S.me.rank}</div><p>of ${S.me.of} players</p>
      <div class="box breakdown"><span>Activity #1</span><b>${s.votes}</b>${C.activity2OnPhones ? `<span>Portfolio</span><b>${s.portfolio}</b>` : ''}<span>Quiz</span><b>${s.quiz}</b>
      <span style="font-weight:800;color:var(--ink)">Total</span><b>${s.total.toLocaleString()}</b></div></div>`;
  },
};

function drops(n) { let h = ''; for (let i = 0; i < C.verifyTokens; i++) h += `<span class="drop ${i < n ? '' : 'used'}"></span>`; return h; }
function sign(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n); }

function coCard(k, stepper) {
  const c = C.companies[k];
  const open = openCo[k] || !stepper;
  const v = draft ? draft[k] : 0;
  return `<div class="co"><div class="h"><div class="nm"><b>${esc(c.alias)}</b><small>Company ${k} · ${esc(c.sector)}</small></div>
    ${stepper ? `<div class="step"><button data-k="${k}" data-d="-1" ${v <= 0 ? 'disabled' : ''}>−</button><span id="v${k}">$${v}M</span><button data-k="${k}" data-d="1">+</button></div>` : ''}</div>
    ${open ? `<div class="story">${esc(c.story)}</div>${C.lenses.map((l) => `<div class="lens"><small>${esc(l)}</small>${esc(c.lens[l])}</div>`).join('')}` : ''}
    ${stepper ? `<button class="more" data-more="${k}">${open ? 'Hide details' : 'Show governance details'}</button>` : ''}</div>`;
}

const bind = {
  ceoAssign: () => {},
  pitchRound: () => {
    document.querySelectorAll('.pcard').forEach((b) => b.onclick = () => {
      document.querySelectorAll('.pcard').forEach((x) => x.classList.toggle('on', x === b));
      socket.emit('pitch:pick', +b.dataset.i);
    });
    document.querySelectorAll('.vbtn[data-v]').forEach((b) => b.onclick = () => {
      document.querySelectorAll('.vbtn[data-v]').forEach((x) => x.classList.toggle('on', x === b));
      socket.emit('pitch:vote', b.dataset.v);
    });
    const v = $('#verify');
    if (v) v.onclick = () => { v.disabled = true; socket.emit('pitch:verify'); };
  },
  superVote: () => document.querySelectorAll('.vbtn[data-s]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('.vbtn[data-s]').forEach((x) => x.classList.toggle('on', x === b));
    socket.emit('pitch:super', b.dataset.s);
  }),

  vote: () => document.querySelectorAll('.vbtn').forEach((b) => b.onclick = () => {
    document.querySelectorAll('.vbtn').forEach((x) => x.classList.toggle('on', x === b));
    socket.emit('vote', b.dataset.o);
  }),
  invest: () => {
    const edit = $('#edit');
    if (edit) { edit.onclick = () => { draft = Object.assign({}, S.me.alloc); lastKey = ''; draw(); }; return; }
    const sync = () => {
      const sum = Object.values(draft).reduce((a, b) => a + b, 0);
      $('#bsum').textContent = `$${sum}M / $10M`;
      $('#bfill').style.width = sum * 10 + '%';
      $('#bfill').style.background = sum > 10 ? 'var(--red)' : 'var(--teal)';
      $('#submit').disabled = sum !== 10;
      document.querySelectorAll('.step button').forEach((b) => {
        const k = b.dataset.k, d = +b.dataset.d;
        b.disabled = d < 0 ? draft[k] <= 0 : draft[k] >= 5 || sum >= 10;
      });
      C.companyOrder.forEach((k) => $('#v' + k).textContent = '$' + draft[k] + 'M');
    };
    document.querySelectorAll('.step button').forEach((b) => b.onclick = () => { draft[b.dataset.k] += +b.dataset.d; sync(); });
    document.querySelectorAll('.more').forEach((b) => b.onclick = () => { openCo[b.dataset.more] = !openCo[b.dataset.more]; lastKey = ''; draw(); });
    $('#submit').onclick = () => {
      $('#submit').disabled = true;
      socket.emit('invest', draft, (res) => {
        if (res && res.ok) { draft = null; investErr = ''; }
        else { investErr = (res && res.error) || 'Try again.'; lastKey = ''; draw(); }
      });
    };
    sync();
  },
  quiz: () => {
    const q = S.quiz;
    if (q.revealed || S.me.answer) return;
    document.querySelectorAll('.qo').forEach((b) => b.onclick = () => {
      document.querySelectorAll('.qo').forEach((x) => { x.disabled = true; x.style.opacity = x === b ? 1 : .3; });
      socket.emit('answer', +b.dataset.i);
    });
    const fill = $('#qfill');
    const step = () => {
      const left = Math.max(0, q.start + q.seconds * 1000 - (Date.now() + offset));
      if (fill) fill.style.width = (left / (q.seconds * 1000)) * 100 + '%';
      if (!left) { clearInterval(tick); document.querySelectorAll('.qo').forEach((x) => { x.disabled = true; x.style.opacity = .3; }); }
    };
    step(); tick = setInterval(step, 100);
  },
};
</script>
</body>
</html>
